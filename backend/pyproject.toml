[project]
name = "lily-backend"
version = "0.1.0"
description = "Lily backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
