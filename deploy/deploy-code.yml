---
# Code-only update for an already-provisioned instance:
# rsync backend → uv sync → render .env → alembic upgrade → build + rsync
# frontend → restart. (Provisioning roles are skipped.)
- name: Deploy Lily code update
  hosts: lily
  become: yes

  vars_files:
    - group_vars/secrets.yml

  roles:
    - app
    - systemd
