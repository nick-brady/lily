---
# Application settings
app_name: lily
app_domain: arrivalstory.com
# The admin dashboard vhost (separate SPA, same backend). Needs its own DNS
# A record and TLS certificate — see roles/nginx + roles/certbot.
admin_domain: admin.arrivalstory.com
app_user: lily
app_group: lily
app_dir: /opt/lily

# Backend settings.
# backend runs a SINGLE uvicorn process on purpose: the SSE broker
# (backend/events.py) is in-process, and the Stripe webhook's live
# broadcasts assume they land on the same process as the subscribers.
# Do not add --workers without first moving the broker to Redis/NATS.
backend_port: 8000

# Python settings
python_version: "3.12"

# Certbot settings
certbot_email: nicholas.aaron.brady@gmail.com

# Database (Postgres installed ON this instance via apt — no RDS)
db_name: lily
db_user: lily

# S3 (media + gift artwork + nightly pg_dump backups). The instance reaches
# S3 via its IAM role — no AWS keys in the env file.
s3_bucket: arrivalstory-media-prod  # ← create before first deploy
aws_region: us-east-1
backup_s3_prefix: "s3://{{ s3_bucket }}/backups/pg"

# Keepsake rendering timezone (family wall-clock time on the artwork)
gift_render_tz: America/New_York

# "Continue with Google" OAuth web client id — public by design (it ships
# in the JS bundle); the secret is never used (GIS ID-token flow). The
# Google console must list https://{{ app_domain }} as an authorized
# JavaScript origin or the button won't render in prod.
google_client_id: 11330872235-d356kmn6d6cvmij8qs6r66bs3jej3bkl.apps.googleusercontent.com
