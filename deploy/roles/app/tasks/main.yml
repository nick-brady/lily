---
- name: Copy backend files
  synchronize:
    src: "{{ playbook_dir }}/../backend/"
    dest: "{{ app_dir }}/backend/"
    rsync_opts:
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=contractions.db"
  notify: restart lily app

- name: Set backend ownership
  file:
    path: "{{ app_dir }}/backend"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes

- name: Create Python virtual environment
  command: python3 -m venv {{ app_dir }}/backend/venv
  args:
    creates: "{{ app_dir }}/backend/venv/bin/python"
  become_user: "{{ app_user }}"

- name: Install Python dependencies
  pip:
    requirements: "{{ app_dir }}/backend/requirements.txt"
    virtualenv: "{{ app_dir }}/backend/venv"
    state: present
  become_user: "{{ app_user }}"
  notify: restart lily app

- name: Build frontend locally
  local_action:
    module: command
    cmd: npm run build
    chdir: "{{ playbook_dir }}/../frontend"
  become: no
  run_once: true

- name: Copy frontend build
  synchronize:
    src: "{{ playbook_dir }}/../frontend/dist/"
    dest: "{{ app_dir }}/frontend/"

- name: Set frontend ownership
  file:
    path: "{{ app_dir }}/frontend"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes

- name: Ensure supervisor picks up the app
  supervisorctl:
    name: "{{ app_name }}"
    state: present
  ignore_errors: yes

- name: Start the application
  supervisorctl:
    name: "{{ app_name }}"
    state: started
