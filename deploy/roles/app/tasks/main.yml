---
- name: Copy backend files
  synchronize:
    src: "{{ playbook_dir }}/../backend/"
    dest: "{{ app_dir }}/backend/"
    rsync_opts:
      - "--exclude=.venv"
      - "--exclude=venv"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=*.db"
      - "--exclude=preview_out"
      - "--exclude=uploads"
      - "--exclude=.pytest_cache"
      - "--exclude=.env"
  notify:
    - restart lily app
    - restart lily worker

- name: Set backend ownership
  file:
    path: "{{ app_dir }}/backend"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes

- name: Install uv
  shell: curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  args:
    creates: /usr/local/bin/uv

- name: Sync Python dependencies (uv, locked)
  command: uv sync --frozen --no-dev
  args:
    chdir: "{{ app_dir }}/backend"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ app_dir }}/venv"
  become_user: "{{ app_user }}"
  register: uv_sync
  changed_when: "'Installed' in uv_sync.stderr or 'Installed' in uv_sync.stdout"
  notify:
    - restart lily app
    - restart lily worker

- name: Render backend environment file
  template:
    src: env.j2
    dest: "{{ app_dir }}/backend/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  notify:
    - restart lily app
    - restart lily worker

# Lives in this role (not common) so deploy-code.yml applies it. The app
# writes JSON lines to {{ app_dir }}/logs with a WatchedFileHandler, which
# reopens the file after logrotate moves it — no copytruncate, no signal.
- name: Rotate app log files
  template:
    src: logrotate.j2
    dest: /etc/logrotate.d/lily
    owner: root
    group: root
    mode: '0644'

# The app's SSE streams hold their DB transactions open for the stream's
# lifetime, so any migration needing an exclusive lock (column/table drops)
# queues behind them forever — and postgres queues every NEW query behind
# the waiting DDL, hanging the site (seen 2026-07-19, migration 0019).
# Restarting first clears those sessions; the migration then wins the gap
# before browsers reconnect. lock_timeout is the tripwire: if something
# still holds a lock, the deploy fails fast instead of wedging prod.
- name: Restart app before migrations (clear idle-in-transaction SSE sessions)
  systemd:
    name: lily
    state: restarted
  register: pre_migrate_restart
  # first provision: the unit doesn't exist yet (systemd role runs after) —
  # nothing is holding locks then either, so a missing service is fine
  failed_when:
    - pre_migrate_restart is failed
    - "'Could not find the requested service' not in (pre_migrate_restart.msg | default(''))"

- name: Run database migrations
  command: "{{ app_dir }}/venv/bin/alembic upgrade head"
  args:
    chdir: "{{ app_dir }}/backend"
  environment:
    DATABASE_URL: "postgresql://{{ db_user }}:{{ db_password }}@localhost:5432/{{ db_name }}"
    PGOPTIONS: "-c lock_timeout=10s"
  become_user: "{{ app_user }}"
  register: alembic_result
  changed_when: "'Running upgrade' in alembic_result.stderr or 'Running upgrade' in alembic_result.stdout"

- name: Build frontend locally
  local_action:
    module: command
    cmd: npm run build
    chdir: "{{ playbook_dir }}/../frontend"
  environment:
    # Vite bakes VITE_* vars into the bundle at build time; the local
    # repo-root .env is docker-compose-only, so pass it explicitly.
    VITE_GOOGLE_CLIENT_ID: "{{ google_client_id }}"
  become: no
  run_once: true

- name: Copy frontend build
  synchronize:
    src: "{{ playbook_dir }}/../frontend/dist/"
    dest: "{{ app_dir }}/frontend/"
    delete: yes

- name: Set frontend ownership
  file:
    path: "{{ app_dir }}/frontend"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes

- name: Build admin frontend locally
  local_action:
    module: command
    cmd: npm run build
    chdir: "{{ playbook_dir }}/../frontend-admin"
  environment:
    # same Google client as the main site; admin.{{ app_domain }} must be an
    # authorized JavaScript origin on it in the Google Cloud console
    VITE_GOOGLE_CLIENT_ID: "{{ google_client_id }}"
  become: no
  run_once: true

- name: Copy admin frontend build
  synchronize:
    src: "{{ playbook_dir }}/../frontend-admin/dist/"
    dest: "{{ app_dir }}/frontend-admin/"
    delete: yes

- name: Set admin frontend ownership
  file:
    path: "{{ app_dir }}/frontend-admin"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes
