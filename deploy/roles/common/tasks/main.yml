---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - python3
      - python3-venv
      - build-essential
      - python3-dev
      - git
      - curl
      - unzip
      - rsync
      - acl              # lets become_user work for unprivileged users
      # gift-artwork rendering (mirrors backend/Dockerfile.dev)
      - libcairo2
      - fontconfig
      - fonts-montserrat
      - fonts-dejavu-core
    state: present

# Nightly pg_dump → S3 needs the aws CLI, but Ubuntu 24.04 dropped the
# `awscli` apt package — install v2 from Amazon's installer instead.
- name: Check for AWS CLI
  stat:
    path: /usr/local/bin/aws
  register: awscli_bin

- name: Install AWS CLI v2
  when: not awscli_bin.stat.exists
  block:
    - name: Download AWS CLI v2
      get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ ansible_architecture }}.zip"
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Unpack AWS CLI v2
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes

    - name: Run AWS CLI installer
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

- name: Create application group
  group:
    name: "{{ app_group }}"
    system: yes

- name: Create application user
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: yes
    shell: /bin/bash
    home: "{{ app_dir }}"
    create_home: no

- name: Create application directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/backend"
    - "{{ app_dir }}/frontend"
    - "{{ app_dir }}/logs"

- name: Install vendored display fonts (Cormorant Garamond — the keepsake face)
  copy:
    src: "{{ playbook_dir }}/../backend/assets/fonts/"
    dest: /usr/local/share/fonts/cormorant/
    owner: root
    group: root
    mode: '0644'
  register: fonts_copied

- name: Refresh font cache
  command: fc-cache -f
  when: fonts_copied.changed
