[defaults]
inventory = inventory.ini
host_key_checking = False
remote_user = ubuntu
private_key_file = ~/.ssh/arrivalstory.pem
roles_path = roles
retry_files_enabled = False
# secrets.yml is ansible-vault encrypted; the password lives outside the repo
vault_password_file = ~/.ansible/vault-pass-arrivalstory

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
