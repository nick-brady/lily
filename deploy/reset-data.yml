---
- name: Reset Lily Data
  hosts: lily
  become: yes

  vars:
    app_dir: /opt/lily

  tasks:
    - name: Stop lily backend
      supervisorctl:
        name: lily
        state: stopped

    - name: Delete uploads directory contents
      shell: rm -rf {{ app_dir }}/backend/uploads/*

    - name: Delete database
      file:
        path: "{{ app_dir }}/backend/contractions.db"
        state: absent

    - name: Start lily backend (will recreate database)
      supervisorctl:
        name: lily
        state: started

    - name: Wait for backend to start
      wait_for:
        port: 8000
        delay: 2
        timeout: 30

    - name: Verify backend is running
      uri:
        url: http://127.0.0.1:8000/
        return_content: yes
      register: result

    - name: Show result
      debug:
        msg: "Backend status: {{ result.json }}"
