services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lily}
      POSTGRES_USER: ${POSTGRES_USER:-lily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lily}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lily} -d ${POSTGRES_DB:-lily}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./.data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lily-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>/dev/null; do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb local/$$S3_BUCKET --ignore-existing;
      echo 'bucket ready';
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lily}:${POSTGRES_PASSWORD:-lily}@db:5432/${POSTGRES_DB:-lily}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PHONE: ${SEED_OWNER_PHONE:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-}
      SEED_COPARENT_EMAIL: ${SEED_COPARENT_EMAIL:-}
      SEED_COPARENT_PHONE: ${SEED_COPARENT_PHONE:-}
      SEED_COPARENT_NAME: ${SEED_COPARENT_NAME:-}
      S3_BUCKET: ${S3_BUCKET:-lily-media}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_PUBLIC_ENDPOINT_URL: ${AWS_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      PRINTFUL_API_KEY: ${PRINTFUL_API_KEY:-}
      PRINTFUL_STORE_ID: ${PRINTFUL_STORE_ID:-}
      PRINTFUL_PRODUCT_MAP: ${PRINTFUL_PRODUCT_MAP:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    # --timeout-graceful-shutdown: on --reload, don't hang waiting for the
    # long-lived SSE stream to close; force-close lingering connections
    # after 1s so code edits actually restart the server.
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 1"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  pgdata:
  uploads:
  frontend-node-modules:
