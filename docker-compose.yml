services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lily}
      POSTGRES_USER: ${POSTGRES_USER:-lily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lily}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lily} -d ${POSTGRES_DB:-lily}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lily}:${POSTGRES_PASSWORD:-lily}@db:5432/${POSTGRES_DB:-lily}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PHONE: ${SEED_OWNER_PHONE:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-}
      SEED_COPARENT_EMAIL: ${SEED_COPARENT_EMAIL:-}
      SEED_COPARENT_PHONE: ${SEED_COPARENT_PHONE:-}
      SEED_COPARENT_NAME: ${SEED_COPARENT_NAME:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  pgdata:
  uploads:
  frontend-node-modules:
