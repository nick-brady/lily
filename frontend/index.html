<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The web fonts are served from this origin. Linking a font CDN hands
         every visitor's IP address to a third party before they have agreed
         to anything; see scripts/vendor-fonts.sh. -->
    <link rel="preload" href="/fonts/quicksand-600-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/cormorant-garamond-600-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- The SPA shell. The four public pages get their own head and body
         from scripts/prerender.mjs at build time (see src/seo/routeMeta.js);
         these are the defaults for every other route. -->
    <title>Arrival Story</title>
    <meta name="description" content="The birth story your whole family lives together. Set up in 2 minutes, share a link, everyone follows in real time." />
    <meta property="og:site_name" content="Arrival Story" />
    <meta property="og:title" content="Arrival Story" />
    <meta property="og:description" content="The birth story your whole family lives together. Set up in 2 minutes, share a link, everyone follows in real time." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arrivalstory.com/" />
    <meta property="og:image" content="https://arrivalstory.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
